name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GNU Fortran
            compiler: gcc
            version: latest

          - name: Intel Fortran (ifx)
            compiler: intel
            version: latest

          - name: Intel Fortran Classic (ifort)
            compiler: intel-classic
            version: '2021.10'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Fortran toolchain
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Report toolchain
        run: |
          echo "FC=$FC"
          echo "CC=$CC"
          "$FC" --version
          "$CC" --version

      - name: Configure
        run: ./configure FC="$FC" CC="$CC"

      - name: Build and run test suite
        run: make --jobs=1 check V=1
